[project]
name = "ingest"
version = "0.1.0"
description = "P2 Geo Data Pipeline: File ingestion, metadata inspection, CRS reprojection, and GeoPackage database management for SIH26011"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "geopandas>=0.14.0",
    "fiona>=1.9.0",
    "pyproj>=3.6.0",
    "shapely>=2.0.0",
    "pyogrio>=0.7.0",
    "rasterio>=1.3.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
