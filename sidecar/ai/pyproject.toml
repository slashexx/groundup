[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "groundup-ai"
version = "0.1.0"
description = "P3 AI Detection & Building/Floor Estimation Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "rasterio>=1.3.0",
    "shapely>=2.0.0",
    "pyproj>=3.4.0",
    "numpy>=1.24.0",
    "jsonschema>=4.17.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]
