[project]
name = "groundup-cadastre"
version = "0.1.0"
description = "3D property units, ULPIN identity, and topological validation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "shapely>=2.0",
  "geopandas>=1.0",
  "rasterio>=1.3",
  "pyproj>=3.6",
  "numpy>=1.26",
  "jsonschema>=4.23",
]

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.7"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
